<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assignment 5 - JS Basics & DOM</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light py-5">
  <div class="container" style="max-width: 600px;">
    <div class="card p-4 shadow-sm mb-4">
      <h3 class="mb-3 text-primary">User Profile (Part 1)</h3>
      <p><strong>Name:</strong> <span id="displayName"></span></p>
      <p><strong>Birth Year:</strong> <span id="displayBirthYear"></span></p>
      <p><strong>Age:</strong> <span id="displayAge"></span> years old</p>
      <p><strong>Age in Months:</strong> <span id="displayMonths"></span> months</p>
      <p><strong>Total Hobbies:</strong> <span id="displayHobbiesCount"></span></p>
      <p><strong>Is Developer:</strong> <span id="displayDev"></span></p>
    </div>

    <div class="card p-4 shadow-sm mb-4">
      <h3 class="mb-3 text-success">Update Profile (Part 2)</h3>
      <div class="mb-3">
        <label for="usernameInput" class="form-label">Username</label>
        <input type="text" id="usernameInput" class="form-control" placeholder="Enter new name">
      </div>
      <div class="mb-3">
        <label for="birthYearInput" class="form-label">Birth Year</label>
        <input type="number" id="birthYearInput" class="form-control" placeholder="e.g. 2004"  min="1900" max="2026">
      </div>
      <button id="updateBtn" class="btn btn-success w-100">Create / Update Profile</button>
    </div>

    <div class="card p-4 shadow-sm">
      <h3 class="mb-3 text-warning text-dark">Hobbies List (Part 3)</h3>
      <div class="input-group mb-3">
        <input type="text" id="hobbyInput" class="form-control" placeholder="New hobby...">
        <button id="addHobbyBtn" class="btn btn-primary">Add Item</button>
        <button id="removeHobbyBtn" class="btn btn-danger">Remove Item</button>
      </div>
      <ul id="hobbyList" class="list-group">
      </ul>
    </div>

  </div>

  <script>
    const userProfile = {
        name: "Aibar",
        birthYear: 2007,
        isDeveloper: true,
        hobbies: ["Coding", "Gaming", "Music"]
    };

    function renderProfile() {
        const currentYear = new Date().getFullYear();
        const age = currentYear - userProfile.birthYear;
        const months = age * 12;
        console.log("--- User Profile ---");
        console.log("Name:", userProfile.name);
        console.log("Calculated Age:", age);
        console.log("Age in Months:", months);
        console.log("Total Hobbies:", userProfile.hobbies.length);
        document.getElementById('displayName').textContent = userProfile.name;
        document.getElementById('displayBirthYear').textContent = userProfile.birthYear;
        document.getElementById('displayAge').textContent = age;
        document.getElementById('displayMonths').textContent = months;
        document.getElementById('displayHobbiesCount').textContent = userProfile.hobbies.length;
        document.getElementById('displayDev').textContent = userProfile.isDeveloper ? "Yes":"No";
    }
    renderProfile();
    const updateBtn = document.getElementById('updateBtn');
    const usernameInput = document.getElementById('usernameInput');
    const birthYearInput = document.getElementById('birthYearInput');

    updateBtn.addEventListener('click', () => {
        const newName = usernameInput.value.trim();
        const newYear = Number(birthYearInput.value);
        if (newName !== "") {
            userProfile.name = newName;
        }
        if (newYear > 1900 && newYear <= new Date().getFullYear()) {
            userProfile.birthYear = newYear;
        }
        renderProfile();

        usernameInput.value = "";
        birthYearInput.value = "";
    });

    const hobbyList = document.getElementById('hobbyList');
    const hobbyInput = document.getElementById('hobbyInput');
    const addHobbyBtn = document.getElementById('addHobbyBtn');
    const removeHobbyBtn = document.getElementById('removeHobbyBtn');

    function renderHobbies() {
        hobbyList.innerHTML = "";
        userProfile.hobbies.forEach(hobby => {
            const li = document.createElement('li');
            li.className = "list-group-item";
            li.textContent = hobby;
            hobbyList.appendChild(li);
        });
    }
    renderHobbies();
    addHobbyBtn.addEventListener('click', () => {
        const text = hobbyInput.value.trim();
        if (text === "") return;
        const li = document.createElement('li');
        li.className = "list-group-item";
        li.textContent = text;
        hobbyList.appendChild(li);
        userProfile.hobbies.push(text);
        renderProfile()
        hobbyInput.value = "";
    });

    removeHobbyBtn.addEventListener('click', () => {
        const lastItem = hobbyList.lastElementChild;
      
        if (lastItem) {
            hobbyList.removeChild(lastItem);
            userProfile.hobbies.pop();
        }
        renderProfile();
    });
  </script>
</body>
</html>
